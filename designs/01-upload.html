<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Split Bill · 1 Upload</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <div class="container">

    <div class="wordmark">
      <div class="wordmark__badge">$</div>
      <span class="wordmark__name">splitbill</span>
    </div>

    <div class="fade-up" style="max-width: 540px; margin: 0 auto; padding-top: 16px;">
      <h1 class="h1">Split the bill.</h1>
      <p class="lede">Upload a receipt and AI extracts every item automatically.</p>

      <div class="dropzone">
        <svg class="dropzone__icon" width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"></path>
          <polyline points="17 8 12 3 7 8"></polyline>
          <line x1="12" y1="3" x2="12" y2="15"></line>
        </svg>
        <p class="dropzone__title">Drop your receipt here</p>
        <p class="dropzone__hint">or click to browse · PNG, JPG, HEIC up to 10MB</p>
      </div>

      <p class="note">Demo: click to simulate a receipt upload</p>
    </div>

  </div>
</div>
</body>
</html>
