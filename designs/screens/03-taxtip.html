<!DOCTYPE html>
<html lang="en">
<head>


<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Split Bill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #152D42;
  --surface: #1C3A54;
  --surface-hi: #254862;
  --border: #2E5674;
  --accent: #00FDDC;
  --accent-dim: oklch(92% 0.14 185 / 0.15);
  --text: #EEF4FA;
  --text-muted: #A0C4DC;
  --text-dim: #7AAAB8;
}
body {
  font-family: 'Plus Jakarta Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; cursor: pointer; }
input  { font-family: inherit; }
@keyframes fadeUp   { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
@keyframes spin     { to { transform: rotate(360deg); } }
@keyframes scaleIn  { from { transform: scale(.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.fade-up  { animation: fadeUp .3s ease both; }
.scale-in { animation: scaleIn .25s cubic-bezier(.34,1.56,.64,1) both; }
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* reference snapshot: show final state instantly (no entrance animation) */
.fade-up, .scale-in { animation: none !important; opacity: 1 !important; transform: none !important; }
</style>




</head>
<body>
<div id="root"><div style="min-height: 100vh; padding: 36px 20px 80px;"><div style="max-width: 760px; margin: 0px auto;"><div style="display: flex; align-items: center; gap: 10px; margin-bottom: 44px;"><div style="width: 34px; height: 34px; border-radius: 9px; background: var(--accent); display: flex; align-items: center; justify-content: center;"><span style="font-weight: 800; font-size: 17px; color: rgb(17, 17, 17);">$</span></div><span style="font-weight: 800; font-size: 17px; letter-spacing: -0.3px;">splitbill</span></div><div style="display: flex; align-items: flex-start; margin-bottom: 40px;"><div style="display: flex; flex-direction: column; align-items: center; gap: 7px; flex-shrink: 0;"><div style="width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: rgb(17, 17, 17); font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: none;">✓</div><span style="font-size: 11px; font-weight: 400; color: var(--text-muted); white-space: nowrap; transition: color 0.3s;">Upload</span></div><div style="flex: 1 1 0%; height: 2px; margin-top: 16px; background: var(--accent); transition: background 0.35s;"></div><div style="display: flex; flex-direction: column; align-items: center; gap: 7px; flex-shrink: 0;"><div style="width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: rgb(17, 17, 17); font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 0 0 5px var(--accent-dim);">2</div><span style="font-size: 11px; font-weight: 700; color: var(--accent); white-space: nowrap; transition: color 0.3s;">Assign</span></div><div style="flex: 1 1 0%; height: 2px; margin-top: 16px; background: var(--border); transition: background 0.35s;"></div><div style="display: flex; flex-direction: column; align-items: center; gap: 7px; flex-shrink: 0;"><div style="width: 34px; height: 34px; border-radius: 50%; background: var(--surface-hi); color: var(--text-dim); font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: none;">3</div><span style="font-size: 11px; font-weight: 400; color: var(--text-dim); white-space: nowrap; transition: color 0.3s;">Tax &amp; Tip</span></div><div style="flex: 1 1 0%; height: 2px; margin-top: 16px; background: var(--border); transition: background 0.35s;"></div><div style="display: flex; flex-direction: column; align-items: center; gap: 7px; flex-shrink: 0;"><div style="width: 34px; height: 34px; border-radius: 50%; background: var(--surface-hi); color: var(--text-dim); font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: none;">4</div><span style="font-size: 11px; font-weight: 400; color: var(--text-dim); white-space: nowrap; transition: color 0.3s;">Done</span></div></div><div class="fade-up" style="max-width: 500px;"><h2 style="font-size: 26px; font-weight: 800; margin-bottom: 4px;">Tax &amp; tip</h2><p style="color: var(--text-muted); font-size: 14px; margin-bottom: 28px;">These are split proportionally based on what each person ordered.</p><div style="background: var(--surface); border-radius: 22px; padding: 24px; margin-bottom: 16px; border: 1px solid var(--border);"><div style="display: flex; justify-content: space-between; padding-bottom: 16px; margin-bottom: 16px; border-bottom: 1px solid var(--border);"><span style="color: var(--text-muted); font-size: 14px;">Subtotal</span><span style="font-weight: 700; font-size: 14px;">$25.15</span></div><div style="margin-bottom: 20px;"><div style="font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px;">Tax</div><div style="display: flex; align-items: center; background: var(--surface-hi); border-radius: 12px; padding: 0px 16px; border: 1.5px solid var(--border);"><span style="color: var(--text-muted); margin-right: 8px; font-size: 15px;">$</span><input type="number" step="0.01" min="0" style="flex: 1 1 0%; background: none; border: none; color: var(--text); font-size: 16px; font-weight: 600; padding: 11px 0px; outline: none;" value="1.87"></div><p style="font-size: 12px; color: var(--text-dim); margin-top: 5px;">Auto-extracted from receipt, tap to edit</p></div><div><div style="font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px;">Tip</div><div style="display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px;"><button style="padding: 8px 14px; border-radius: 10px; border: none; font-size: 13px; font-weight: 700; cursor: pointer; background: var(--surface-hi); color: var(--text-muted); transition: 0.15s;">15%</button><button style="padding: 8px 14px; border-radius: 10px; border: none; font-size: 13px; font-weight: 700; cursor: pointer; background: var(--surface-hi); color: var(--text-muted); transition: 0.15s;">18%</button><button style="padding: 8px 14px; border-radius: 10px; border: none; font-size: 13px; font-weight: 700; cursor: pointer; background: var(--accent); color: rgb(17, 17, 17); transition: 0.15s;">20%</button><button style="padding: 8px 14px; border-radius: 10px; border: none; font-size: 13px; font-weight: 700; cursor: pointer; background: var(--surface-hi); color: var(--text-muted); transition: 0.15s;">22%</button><button style="padding: 8px 14px; border-radius: 10px; border: none; font-size: 13px; font-weight: 700; cursor: pointer; background: var(--surface-hi); color: var(--text-muted); transition: 0.15s;">25%</button><button style="padding: 8px 14px; border-radius: 10px; border: none; font-size: 13px; font-weight: 700; cursor: pointer; background: var(--surface-hi); color: var(--text-muted); transition: 0.15s;">Custom</button></div><p style="font-size: 13px; color: var(--text-muted);">= $5.03</p></div></div><div style="background: var(--accent); border-radius: 18px; padding: 18px 24px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center;"><span style="font-weight: 700; font-size: 16px; color: rgb(17, 17, 17);">Total</span><span style="font-weight: 800; font-size: 28px; color: rgb(17, 17, 17); letter-spacing: -1px;">$32.05</span></div><div style="display: flex; gap: 10px;"><button style="padding: 14px 24px; border-radius: 14px; border: none; background: var(--surface-hi); color: var(--text-muted); font-weight: 700; font-size: 14px; cursor: pointer;">← Back</button><button style="flex: 1 1 0%; padding: 14px; border-radius: 14px; border: none; background: var(--accent); color: rgb(17, 17, 17); font-weight: 700; font-size: 15px; cursor: pointer;">See Breakdown →</button></div></div></div></div></div>
</body>
</html>
