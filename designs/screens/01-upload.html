<!DOCTYPE html>
<html lang="en">
<head>


<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Split Bill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #152D42;
  --surface: #1C3A54;
  --surface-hi: #254862;
  --border: #2E5674;
  --accent: #00FDDC;
  --accent-dim: oklch(92% 0.14 185 / 0.15);
  --text: #EEF4FA;
  --text-muted: #A0C4DC;
  --text-dim: #7AAAB8;
}
body {
  font-family: 'Plus Jakarta Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; cursor: pointer; }
input  { font-family: inherit; }
@keyframes fadeUp   { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
@keyframes spin     { to { transform: rotate(360deg); } }
@keyframes scaleIn  { from { transform: scale(.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.fade-up  { animation: fadeUp .3s ease both; }
.scale-in { animation: scaleIn .25s cubic-bezier(.34,1.56,.64,1) both; }
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* reference snapshot: show final state instantly (no entrance animation) */
.fade-up, .scale-in { animation: none !important; opacity: 1 !important; transform: none !important; }
</style>




</head>
<body>
<div id="root"><div style="min-height: 100vh; padding: 36px 20px 80px;"><div style="max-width: 760px; margin: 0px auto;"><div style="display: flex; align-items: center; gap: 10px; margin-bottom: 44px;"><div style="width: 34px; height: 34px; border-radius: 9px; background: var(--accent); display: flex; align-items: center; justify-content: center;"><span style="font-weight: 800; font-size: 17px; color: rgb(17, 17, 17);">$</span></div><span style="font-weight: 800; font-size: 17px; letter-spacing: -0.3px;">splitbill</span></div><div class="fade-up" style="max-width: 540px; margin: 0px auto; padding-top: 16px;"><h1 style="font-size: 34px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 8px;">Split the bill.</h1><p style="color: var(--text-muted); font-size: 15px; margin-bottom: 40px; line-height: 1.5;">Upload a receipt and AI extracts every item automatically.</p><div style="border-radius: 24px; border: 2px dashed var(--border); background: var(--surface); padding: 72px 40px; text-align: center; cursor: pointer; transition: 0.2s; position: relative;"><div class="fade-up"><svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin: 0px auto 20px;"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg><p style="font-weight: 700; font-size: 18px; margin-bottom: 8px;">Drop your receipt here</p><p style="color: var(--text-muted); font-size: 13px;">or click to browse · PNG, JPG, HEIC up to 10MB</p></div></div><p style="text-align: center; margin-top: 16px; color: var(--text-dim); font-size: 12px;">Demo: click to simulate a receipt upload</p></div></div></div></div>
</body>
</html>
