[project]
name = "split-bill-backend"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.109.0",
    "uvicorn[standard]==0.27.0",
    "python-multipart==0.0.6",
    "anthropic",
    "pydantic==2.5.3",
    "pydantic-settings==2.1.0",
    "sqlalchemy==2.0.25",
    "psycopg2-binary==2.9.9",
    "python-dotenv==1.0.0",
    "Pillow==10.2.0",
    "pillow-heif==0.21.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-cov==5.0.0",
    "httpx==0.27.2",
]

# Not a distributable package — uv only manages the venv and dependencies.
[tool.uv]
package = false
